<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Voice Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <p class="subtitle">Voice Training – User Management</p>
    </header>

    <main>
        <!-- Auth Bar -->
        <div id="auth-bar" class="panel auth-bar">
            <div id="auth-forms" class="auth-forms">
                <input type="text" id="auth-username" placeholder="Username" class="auth-input" />
                <input type="password" id="auth-password" placeholder="Password" class="auth-input" />
                <button id="login-btn" class="secondary-btn">Log In</button>
                <button id="register-btn" class="secondary-btn">Register</button>
                <span id="auth-error" class="auth-error"></span>
            </div>
            <div id="user-bar" class="user-bar" hidden>
                <span id="user-name" class="user-email"></span>
                <button id="logout-btn" class="secondary-btn">Log Out</button>
                <a href="/" class="secondary-btn">Back to App</a>
                <a href="/admin" id="admin-link" class="secondary-btn" hidden>Admin Dashboard</a>
            </div>
        </div>

        <!-- Access Denied -->
        <section class="panel" id="admin-denied" hidden>
            <p>You do not have admin access. Please log in with an admin account.</p>
            <a href="/" class="secondary-btn">Back to App</a>
        </section>

        <!-- Admin Content -->
        <section class="panel" id="admin-content" hidden>
            <h2>All Users</h2>
            <div class="table-wrapper">
                <table class="admin-table" id="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Role</th>
                            <th>Registered</th>
                            <th>G</th>
                            <th>R</th>
                            <th>B</th>
                            <th>A</th>
                            <th>S</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- User Detail Panel -->
        <section class="panel" id="user-detail-panel" hidden>
            <h2 id="detail-title">User Analysis History</h2>
            <button class="secondary-btn" id="detail-close-btn">Close</button>
            <div id="user-detail-content"></div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="admin.js"></script>
</body>
</html>
